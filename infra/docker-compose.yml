name: spend-brake

services:
  valkey:
    image: valkey/valkey:8
    ports:
      - '${BRAKE_VALKEY_PORT:-16379}:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: brake
      POSTGRES_PASSWORD: brake
      POSTGRES_DB: brake
    ports:
      - '${BRAKE_POSTGRES_PORT:-15432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U brake -d brake']
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
