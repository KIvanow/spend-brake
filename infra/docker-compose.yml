# Full stack: docker compose -f infra/docker-compose.yml up -d --build --wait
# Needs infra/.env (copy infra/.env.example). Valkey and Postgres are not published to the host:
# only the services reach them. For local development use docker-compose.dev.yml.
name: spend-brake

x-health: &health
  interval: 5s
  timeout: 3s
  retries: 30

x-stores: &stores
  VALKEY_URL: redis://:${VALKEY_PASSWORD:?set VALKEY_PASSWORD in infra/.env}@valkey:6379
  DATABASE_URL: postgres://brake:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}@postgres:5432/brake
  LOG_LEVEL: info

services:
  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    # Caps live here: never evict (an evicted spent counter would reset a cap), persist across
    # restarts, require a password. The API also rebuilds config records from Postgres on start.
    command:
      - valkey-server
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in infra/.env}
    environment:
      REDISCLI_AUTH: ${VALKEY_PASSWORD}
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      <<: *health

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: brake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: brake
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U brake -d brake']
      <<: *health

  # Each service gets only the secrets it uses.
  api:
    build: { context: .., dockerfile: infra/Dockerfile, args: { APP: api } }
    restart: unless-stopped
    environment:
      <<: *stores
      PORT: '8081'
      BRAKE_MASTER_KEY: ${BRAKE_MASTER_KEY:?set BRAKE_MASTER_KEY in infra/.env}
      BRAKE_ACTION_SECRET: ${BRAKE_ACTION_SECRET:?set BRAKE_ACTION_SECRET in infra/.env}
      BRAKE_SETUP_TOKEN: ${BRAKE_SETUP_TOKEN:-}
      ALLOW_PRIVATE_COLLECTORS: ${ALLOW_PRIVATE_COLLECTORS:-false}
      # Sign in with emailed links (the notifier sends them: it needs SMTP_URL).
      BRAKE_EMAIL_SIGN_IN: ${BRAKE_EMAIL_SIGN_IN:-false}
      BRAKE_DASHBOARD_URL: ${BRAKE_DASHBOARD_URL:-http://localhost:3000}
      BRAKE_PUBLIC_PROXY_URL: ${BRAKE_PUBLIC_PROXY_URL:-http://localhost:8080}
      # The proxy's outbound IPs: the dashboard tells people to restrict provider keys to them.
      BRAKE_PROXY_EGRESS_IPS: ${BRAKE_PROXY_EGRESS_IPS:-}
    ports: ['8081:8081']
    depends_on:
      valkey: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8081/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      <<: *health

  proxy:
    build: { context: .., dockerfile: infra/Dockerfile, args: { APP: proxy } }
    restart: unless-stopped
    environment:
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379
      LOG_LEVEL: info
      PORT: '8080'
      BRAKE_MASTER_KEY: ${BRAKE_MASTER_KEY}
    ports: ['8080:8080']
    depends_on:
      valkey: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      <<: *health

  worker:
    build: { context: .., dockerfile: infra/Dockerfile, args: { APP: worker } }
    restart: unless-stopped
    environment:
      <<: *stores
      # Decrypts the billing-export service account (reconciliation).
      BRAKE_MASTER_KEY: ${BRAKE_MASTER_KEY}
      ALLOW_PRIVATE_COLLECTORS: ${ALLOW_PRIVATE_COLLECTORS:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
    # The API runs migrations first.
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:9464/metrics').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      <<: *health

  notifier:
    build: { context: .., dockerfile: infra/Dockerfile, args: { APP: notifier } }
    restart: unless-stopped
    environment:
      <<: *stores
      PORT: '8082'
      BRAKE_API_URL: http://api:8081
      BRAKE_MASTER_KEY: ${BRAKE_MASTER_KEY}
      BRAKE_ACTION_SECRET: ${BRAKE_ACTION_SECRET}
      BRAKE_PUBLIC_URL: ${BRAKE_PUBLIC_URL:-http://localhost:8082}
      BRAKE_DASHBOARD_URL: ${BRAKE_DASHBOARD_URL:-http://localhost:3000}
      SMTP_URL: ${SMTP_URL:-}
      BRAKE_EMAIL_FROM: ${BRAKE_EMAIL_FROM:-Spend Brake <alerts@localhost>}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
    ports: ['8082:8082']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8082/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      <<: *health

  web:
    build: { context: .., dockerfile: infra/web.Dockerfile }
    restart: unless-stopped
    ports: ['3000:80']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      <<: *health

volumes:
  pgdata:
  valkeydata:
