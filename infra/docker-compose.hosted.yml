# The hosted service: adds billing (Stripe test mode unless BILLING_LIVE_MODE=true) to the
# stack. The dashboard forwards /v1/billing to it; Stripe sends webhooks to
# https://<app domain>/v1/billing/webhook.
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.hosted.yml up -d --build
services:
  # Customers sign up and sign in with emailed links.
  api:
    environment:
      BRAKE_HOSTED_SIGNUP: ${BRAKE_HOSTED_SIGNUP:-false}
      BRAKE_EMAIL_SIGN_IN: ${BRAKE_EMAIL_SIGN_IN:-true}

  billing:
    build: { context: .., dockerfile: infra/Dockerfile, args: { APP: billing } }
    restart: unless-stopped
    environment:
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379
      DATABASE_URL: postgres://brake:${POSTGRES_PASSWORD}@postgres:5432/brake
      PORT: '8083'
      # Rate limits per client: the address comes from X-Forwarded-For, trusting only the private
      # hops in front (the dashboard's nginx, and Caddy with docker-compose.tls.yml).
      TRUST_PROXY: 'true'
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY (sk_test_..., or sk_live_... with BILLING_LIVE_MODE=true) in infra/.env}
      # true takes real payments, and then STRIPE_SECRET_KEY must be a live key (and vice versa).
      BILLING_LIVE_MODE: ${BILLING_LIVE_MODE:-false}
      # Stripe Tax on Checkout; empty follows BILLING_LIVE_MODE (needs Stripe Tax set up in Stripe).
      BILLING_AUTOMATIC_TAX: ${BILLING_AUTOMATIC_TAX:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?set STRIPE_WEBHOOK_SECRET (whsec_...) in infra/.env}
      BRAKE_DASHBOARD_URL: ${BRAKE_DASHBOARD_URL:-http://localhost:3000}
      BRAKE_HOSTED_SIGNUP: ${BRAKE_HOSTED_SIGNUP:-false}
      # Signs Business / Enterprise license files; mount the key, never bake it into an image.
      BRAKE_LICENSE_SIGNING_KEY_FILE: ${BRAKE_LICENSE_SIGNING_KEY_FILE:-}
    volumes:
      - ${BRAKE_LICENSE_SIGNING_KEY_DIR:-./license-key}:/run/secrets/license:ro
    deploy:
      resources:
        limits: { memory: '${BRAKE_BILLING_MEMORY:-192M}', cpus: '${BRAKE_BILLING_CPUS:-0.5}' }
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8083/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
