server {
  listen 80;
  root /usr/share/nginx/html;

  server_tokens off;

  # Headers set here reach every location (none of them adds its own, which would drop these).
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  # Browsers ignore HSTS over plain HTTP; behind Caddy (docker-compose.tls.yml) it pins HTTPS.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # The dashboard is one script and one stylesheet from here and calls only /v1 here; the admin
  # token lives in localStorage, so nothing else may run. Stripe pages are navigations.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Hosted billing (docker-compose.hosted.yml). Resolved per request, so a stack without the
  # billing service still starts; there the dashboard says billing is not available.
  resolver 127.0.0.11 valid=30s ipv6=off;
  location /v1/billing/ {
    set $billing http://billing:8083;
    proxy_pass $billing;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /v1/billing {
    set $billing http://billing:8083;
    proxy_pass $billing;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /v1/ {
    proxy_pass http://api:8081;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
