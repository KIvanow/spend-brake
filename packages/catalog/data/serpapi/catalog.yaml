# SerpApi sells monthly plans, not single searches. A search's price is the plan's monthly fee
# divided by its searches, rounded up; the proxy prices every search at the plan the org names
# (Starter, the dearest per search, by default). Only successful, uncached searches count against
# a plan; the proxy cannot tell a cached search apart, so it charges every successful one.
