name: Release

# Push a tag like v0.1.0 (matching apps/cli/package.json's version) to publish:
# - container images to ghcr.io/<owner>/spend-brake-<service>:<version> and :latest
# - the CLI to npm as @spend-brake/cli (needs the NPM_TOKEN repository secret)
# - a GitHub release with that version's CHANGELOG section
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          cli="$(node -p "require('./apps/cli/package.json').version")"
          if [ "$version" != "$cli" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match apps/cli/package.json version $cli"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  images:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: proxy, file: infra/Dockerfile, app: proxy, start: start }
          - { name: api, file: infra/Dockerfile, app: api, start: start }
          - { name: worker, file: infra/Dockerfile, app: worker, start: start }
          - { name: notifier, file: infra/Dockerfile, app: notifier, start: start }
          - { name: billing, file: infra/Dockerfile, app: billing, start: start }
          - { name: ee-api, file: infra/Dockerfile, app: ee, start: 'start:api' }
          - { name: ee-worker, file: infra/Dockerfile, app: ee, start: 'start:worker' }
          - { name: web, file: infra/web.Dockerfile, app: web, start: start }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/spend-brake-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: |
            APP=${{ matrix.app }}
            START=${{ matrix.start }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=${{ startsWith(matrix.name, 'ee-') && 'LicenseRef-Spend-Brake-EE' || 'Apache-2.0' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  npm:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@spend-brake/cli...
      - name: Publish @spend-brake/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set; skipping the npm release"
            exit 0
          fi
          cd apps/cli && npm publish --provenance --access public

  release:
    needs: [version, images, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ needs.version.outputs.version }}" '
            $0 ~ "^## \\[?"v"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
